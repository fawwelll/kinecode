name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev nlohmann-json3-dev libreadline-dev pkg-config
      - name: build
        run: g++ -std=c++17 -O2 $(pkg-config --cflags libcurl) -o kinecode-linux kinecode.cpp $(pkg-config --libs libcurl) -lreadline
      - uses: actions/upload-artifact@v4
        with:
          name: kinecode-linux
          path: kinecode-linux

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-curl mingw-w64-x86_64-nlohmann-json
      - name: build
        run: g++ -std=c++17 -O2 -o kinecode.exe kinecode.cpp -lcurl -lws2_32 -lwldap32 -static-libgcc -static-libstdc++
      - uses: actions/upload-artifact@v4
        with:
          name: kinecode-windows
          path: kinecode.exe

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kinecode-linux
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: kinecode-windows
          path: .
      - name: make executable
        run: chmod +x kinecode-linux
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            kinecode-linux
            kinecode.exe
          generate_release_notes: true
