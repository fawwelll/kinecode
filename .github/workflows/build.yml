name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev nlohmann-json3-dev libreadline-dev pkg-config
      - name: build
        run: g++ -std=c++17 -O2 $(pkg-config --cflags libcurl) -o kinecode-linux kinecode.cpp $(pkg-config --libs libcurl) -lreadline
      - uses: actions/upload-artifact@v4
        with:
          name: kinecode-linux
          path: kinecode-linux

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: vcpkg install curl:x64-windows-static nlohmann-json:x64-windows-static
      - name: build
        shell: cmd
        run: |
          cl /EHsc /O2 /std:c++17 /I "%VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\include" kinecode.cpp /Fe:kinecode.exe /link /LIBPATH:"%VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib" libcurl.lib ws2_32.lib wldap32.lib crypt32.lib advapi32.lib normaliz.lib
      - uses: actions/upload-artifact@v4
        with:
          name: kinecode-windows
          path: kinecode.exe

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kinecode-linux
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: kinecode-windows
          path: .
      - name: make executable
        run: chmod +x kinecode-linux
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            kinecode-linux
            kinecode.exe
          generate_release_notes: true
