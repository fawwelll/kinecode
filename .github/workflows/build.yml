name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev nlohmann-json3-dev libreadline-dev pkg-config
      - name: build
        run: g++ -std=c++17 -O2 $(pkg-config --cflags libcurl) -o kinecode-linux kinecode.cpp $(pkg-config --libs libcurl) -lreadline
      - name: smoke test (tls)
        run: |
          printf '/addprovider t\nhttps://api.github.com/nonexistent\nsk-dummy\n/fetchmodels\n/exit\n' | ./kinecode-linux > out.txt 2>&1 || true
          cat out.txt
          grep -qE "HTTP 40[134]" out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kinecode-linux
          path: kinecode-linux

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-curl mingw-w64-x86_64-nlohmann-json
      - name: build (fully static)
        run: g++ -std=c++17 -O2 -DCURL_STATICLIB -o kinecode.exe kinecode.cpp -static -lcurl -lssl -lcrypto -lssh2 -lnghttp2 -lngtcp2 -lngtcp2_crypto_ossl -lnghttp3 -lcares -lpsl -lidn2 -lunistring -liconv -lintl -lgnutls -lhogweed -lnettle -lgmp -ltasn1 -lffi -lzstd -lz -lbrotlidec -lbrotlicommon -lws2_32 -lwldap32 -lcrypt32 -lbcrypt -lnormaliz -liphlpapi -lsecur32
      - name: verify no non-system dlls
        run: |
          imports=$(objdump -x kinecode.exe | grep -iE "DLL Name" || true)
          echo "$imports"
          if echo "$imports" | grep -iqE "libcurl|libwinpthread|libstdc|libgcc"; then
            echo "ERROR: non-system DLL dependency found"
            exit 1
          fi
      - name: smoke test (tls via native ca)
        run: |
          printf '/addprovider t\nhttps://api.github.com/nonexistent\nsk-dummy\n/fetchmodels\n/exit\n' | ./kinecode.exe > out.txt 2>&1 || true
          cat out.txt
          grep -qE "HTTP 40[134]" out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kinecode-windows
          path: kinecode.exe

  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev nlohmann-json3-dev libreadline-dev pkg-config
      - name: build
        run: g++ -std=c++17 -O2 $(pkg-config --cflags libcurl) -o kinecode-linux kinecode.cpp $(pkg-config --libs libcurl) -lreadline
      - name: package appimage
        run: |
          set -e
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract >/dev/null
          mkdir -p AppDir/usr/bin
          cp kinecode-linux AppDir/usr/bin/kinecode
          ./squashfs-root/AppRun --appdir AppDir -d kinecode.desktop -i icon.png --output appimage
          ls *.AppImage
          mv $(ls kinecode-*.AppImage | head -1) kinecode-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: kinecode-appimage
          path: kinecode-x86_64.AppImage

  windows-sign:
    needs: windows
    runs-on: ubuntu-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kinecode-windows
          path: .
      - name: sign via SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-url: 'https://signpath.io/api/v1'
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'kinecode'
          signing-policy-slug: 'release-signing'
          artifact-configuration-file: 'signpath/artifact-configuration.xml'
          input-artifact-path: 'kinecode.exe'
          output-artifact-directory: 'signed'
          wait-for-completion: true
      - name: upload signed exe
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: kinecode-windows-signed
          path: signed/kinecode.exe

  release:
    needs: [linux, windows, appimage, windows-sign]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kinecode-linux
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: kinecode-appimage
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: kinecode-windows-signed
          path: signed-win/
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: kinecode-windows
          path: unsigned-win/
      - name: pick exe (signed if available)
        run: |
          if [ -f signed-win/kinecode.exe ]; then
            cp signed-win/kinecode.exe kinecode.exe
            echo "using SIGNED exe"
          else
            cp unsigned-win/kinecode.exe kinecode.exe
            echo "using UNSIGNED exe"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            kinecode-linux
            kinecode-x86_64.AppImage
            kinecode.exe
          generate_release_notes: true
